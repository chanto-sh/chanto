<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="chanto logo">
  <!-- The app mark: a terminal prompt chevron that becomes a check mark
       ("your agent, verified"). Colors live in the defs. -->
  <title>chanto</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1f2a"/>
      <stop offset="1" stop-color="#0d1017"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="27.25" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>
  <!-- terminal chevron -->
  <path d="M30 42 L52 64 L30 86" fill="none" stroke="#e5e7eb" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- check mark -->
  <path d="M60 70 L72 82 L98 50" fill="none" stroke="url(#mark)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
