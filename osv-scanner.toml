# Advisories that don't affect Chanto, read by OSV-Scanner and OpenSSF
# Scorecard. Each says why; cargo-deny keeps its own list in deny.toml.

[[IgnoredVulns]]
id = "RUSTSEC-2024-0429"
reason = "glib 0.18 comes only through the Linux desktop app's GTK stack (tao, wry, muda); Chanto never uses VariantStrIter. Fixed upstream by moving to gtk 0.20+."

[[IgnoredVulns]]
id = "RUSTSEC-2024-0370"
reason = "proc-macro-error is unmaintained, not vulnerable; it's a build-time macro of glib-macros in the same desktop GTK stack."

[[IgnoredVulns]]
id = "RUSTSEC-2025-0141"
reason = "bincode 1.3.3 (via syntect, for syntax highlighting) is unmaintained but complete, not vulnerable; also ignored in deny.toml."

# Version-limited by scripts/check-advisory-exceptions.py in both scan workflows.
# Evidence and reproducer: docs/security/block-buffer-advisory.md.
[[IgnoredVulns]]
id = "GHSA-qwgh-2vcv-g2f7"
reason = "False positive for block-buffer 0.10.4: its cursor is a separate pos field, not inline in the data block, and it has no ReadBuffer. The advisory's caught-panic reproducer preserves the cursor in 0.10.4. Other pre-fix versions fail the exception guard; 0.12.1+ is patched upstream."
