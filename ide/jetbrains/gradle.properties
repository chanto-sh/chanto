# IntelliJ IDEA version to compile and test against (the unified distribution;
# IntelliJ IDEA Community stopped being published at 2025.3).
# Override with -PlocalIde=/path/to/IDE.app to build against an installed IDE.
platformVersion = 2025.3.1

# The IDE bundles the Kotlin runtime; don't package a second copy.
kotlin.stdlib.default.dependency = false

org.gradle.jvmargs = -Xmx2g
org.gradle.caching = true
