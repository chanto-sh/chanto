version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Conventional Commits titles: "build(deps): bump ..."
    commit-message:
      prefix: build
      include: scope
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Conventional Commits titles: "ci(deps): bump ..."
    commit-message:
      prefix: ci
      include: scope
    open-pull-requests-limit: 3
