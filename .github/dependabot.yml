# At most two pull requests per ecosystem a week: minor and patch updates
# together in the "deps" group (auto-merged once CI passes, see
# workflows/dependabot.yml) and major updates together (left for review).
# Security updates are grouped the same way. Group names stay short: they go
# into the pull request title, which must fit the 72-character commit subject.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Conventional Commits titles: "build(deps): bump ..."
    commit-message:
      prefix: build
      include: scope
    open-pull-requests-limit: 5
    groups:
      deps:
        applies-to: version-updates
        update-types: [minor, patch]
      major:
        applies-to: version-updates
        update-types: [major]
      security:
        applies-to: security-updates
        patterns: ["*"]

  # The ClusterFuzzLite build image, pinned by digest.
  - package-ecosystem: docker
    directory: /.clusterfuzzlite
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
      include: scope
    open-pull-requests-limit: 1

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Conventional Commits titles: "ci(deps): bump ..."
    commit-message:
      prefix: ci
      include: scope
    open-pull-requests-limit: 3
    groups:
      deps:
        applies-to: version-updates
        update-types: [minor, patch]
      major:
        applies-to: version-updates
        update-types: [major]
