# Fuzzes the security-critical parsers (fuzz/: the shell permission check,
# secret redaction, URL checks) with ClusterFuzzLite for a few minutes on each
# pull request that touches them. Code-change mode: a crash it finds is
# reported on the pull request. Not a required check.
name: fuzz
on:
  pull_request:
    paths:
      - "src/**"
      - "fuzz/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".clusterfuzzlite/**"
      - ".github/workflows/fuzz.yml"
  workflow_dispatch:
concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  pr:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Read-only, so pull requests from forks run it the same way. `actions:
    # read` lets ClusterFuzzLite fetch corpora from earlier runs' artifacts.
    permissions:
      contents: read
      actions: read
    steps:
      - name: Build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: address
      - name: Run fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 300
          mode: code-change
          sanitizer: address
          output-sarif: false
