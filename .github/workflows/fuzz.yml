# Fuzz the security-critical parsers on every pull request and merge group.
# Keep this workflow unfiltered so its required check is always reported.
name: fuzz
on:
  pull_request:
  merge_group:
  workflow_dispatch:
concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  # Fuzzing only says something about Rust code, so a change that touches no
  # Rust (docs, workflows, the site, the IDE plugins) skips it. The check is
  # required, and a skipped job counts as passing; a path filter on the
  # workflow instead would leave the check waiting forever.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "$BASE...$HEAD" | grep -qE '(^|/)(src|fuzz|proto|\.clusterfuzzlite)/|\.rs$|(^|/)Cargo\.(toml|lock)$|^\.github/workflows/fuzz\.yml$'; then
            echo rust=true >> "$GITHUB_OUTPUT"
          else
            echo rust=false >> "$GITHUB_OUTPUT"
          fi

  pr:
    needs: changes
    # The merge queue and manual runs always fuzz; a pull request only when
    # it changes Rust.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Read-only, so pull requests from forks run it the same way. `actions:
    # read` lets ClusterFuzzLite fetch corpora from earlier runs' artifacts.
    permissions:
      contents: read
      actions: read
    steps:
      - name: Build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: address
      - name: Run fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 300
          # Merge groups have no PR diff; fuzz the combined tree in batch mode.
          mode: ${{ github.event_name == 'merge_group' && 'batch' || 'code-change' }}
          sanitizer: address
          output-sarif: false
