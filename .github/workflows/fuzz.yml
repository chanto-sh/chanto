# Fuzz the security-critical parsers on every pull request and merge group.
# Keep this workflow unfiltered so its required check is always reported.
name: fuzz
on:
  pull_request:
  merge_group:
  workflow_dispatch:
concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  pr:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Read-only, so pull requests from forks run it the same way. `actions:
    # read` lets ClusterFuzzLite fetch corpora from earlier runs' artifacts.
    permissions:
      contents: read
      actions: read
    steps:
      - name: Build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: address
      - name: Run fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 300
          # Merge groups have no PR diff; fuzz the combined tree in batch mode.
          mode: ${{ github.event_name == 'merge_group' && 'batch' || 'code-change' }}
          sanitizer: address
          output-sarif: false
