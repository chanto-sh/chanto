# Commit message rules (.githooks/commit-msg), enforced server-side so they
# don't depend on anyone having enabled the local hook:
# - the hook's own tests, so the rules can't silently regress;
# - the pull request title, which becomes the squash-merge commit on main
#   (the main ruleset requires this check before merging);
# - a Developer Certificate of Origin sign-off on every commit in a pull
#   request, from the commit's author (bots excepted);
# - every commit pushed to main, which catches a direct push that bypassed
#   the pull request flow.
name: commits
# In the merge queue only the hook tests run; the PR title was checked on
# the pull request, and a skipped required check counts as passing.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hook-tests:
    name: commit-msg hook tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: sh .githooks/test-commit-msg.sh

  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The title goes through the environment, never into the script text,
      # so a crafted title can't inject shell.
      # Dependabot's grouped titles ("... in the deps group across 1
      # directory") run past 72 characters and can't be shortened.
      - env:
          TITLE: ${{ github.event.pull_request.title }}
          COMMIT_SUBJECT_MAX: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && '120' || '72' }}
          # A title has no sign-off; the commits are checked below.
          REQUIRE_SIGNOFF: "0"
        run: |
          printf '%s\n' "$TITLE" > "$RUNNER_TEMP/title"
          sh .githooks/commit-msg "$RUNNER_TEMP/title"

  pr-description:
    name: PR description
    if: github.event_name == 'pull_request' && !endsWith(github.event.pull_request.user.login, '[bot]')
    runs-on: ubuntu-latest
    steps:
      # The body goes through the environment, never into the script text.
      # Each section from .github/pull_request_template.md must have text of
      # its own, not just the template's comments.
      - env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 - <<'PY'
          import os, re, sys
          raw = os.environ.get("BODY") or ""
          # A squash merge copies the description into the commit on main, so
          # it follows the commit message rule on AI attribution
          # (.githooks/commit-msg): checked here, before it can land.
          ai = "claude|anthropic|openai|gpt|copilot|gemini|cursor|codex|devin"
          credits = (
              re.search(rf"co-authored-by:.*({ai})", raw, re.I)
              or re.search(r"(generated|written|created|made) with .*(claude|copilot|chatgpt|gpt|cursor|codex|gemini|devin)", raw, re.I)
              or re.search(r"Generated with \[Claude Code\]|\U0001F916", raw)
          )
          if credits:
              print(f"::error::The PR description credits an AI assistant ({credits.group(0)!r}); remove the attribution, since a squash merge copies it into the commit on main.")
          body = re.sub(r"<!--.*?-->", "", raw, flags=re.S)
          sections = {}
          for m in re.finditer(r"^##\s+(.+?)\s*$\n(.*?)(?=^##\s|\Z)", body, re.M | re.S):
              sections[m.group(1).strip().lower()] = m.group(2).strip()
          missing = [s for s in ("What this changes", "Testing") if not sections.get(s.lower())]
          for s in missing:
              print(f"::error::The PR description needs a filled-in '## {s}' section (see .github/pull_request_template.md).")
          sys.exit(1 if missing or credits else 0)
          PY

  sign-off:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            name=$(git log -1 --format=%an "$c")
            email=$(git log -1 --format=%ae "$c")
            case "$name" in *'[bot]') continue ;; esac
            # A Signed-off-by line carrying the author's own address.
            if ! git log -1 --format=%B "$c" | grep '^Signed-off-by: ' | grep -qiF "<$email>"; then
              echo "::error::commit $c by $name <$email> isn't signed off. Sign off with \`git commit -s\`, or \`git rebase --signoff\` for existing commits (CONTRIBUTING.md#signing-off-commits)."
              status=1
            fi
          done
          exit "$status"

  pushed-commits:
    name: commits on main
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # A new branch has no "before"; then only the pushed tip is checked.
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$AFTER"
          else
            range="$AFTER -1"
          fi
          status=0
          # shellcheck disable=SC2086 # $range is deliberately split
          for c in $(git rev-list --no-merges $range); do
            git log -1 --format=%B "$c" > "$RUNNER_TEMP/msg"
            max=72
            [ "$(git log -1 --format=%an "$c")" = "dependabot[bot]" ] && max=120
            # Squash merges are written by GitHub; the pull request's own
            # commits were checked for sign-offs before merging.
            if ! REQUIRE_SIGNOFF=0 COMMIT_SUBJECT_MAX=$max sh .githooks/commit-msg "$RUNNER_TEMP/msg"; then
              echo "::error::commit $c doesn't follow the commit message rules"
              status=1
            fi
          done
          exit "$status"
