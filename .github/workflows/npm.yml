# npm: `npm i -g @chanto/cli` (npm refuses the unscoped name `chanto` as too
# close to `chance`). One package per platform (@chanto/cli-<os>-<cpu>) holds
# that platform's binary from a GitHub release; @chanto/cli picks it through
# optionalDependencies. The release workflow calls this after each release;
# to retry, re-run this job in that release's run.
#
# Publishing uses npm trusted publishing: each package on npmjs.com trusts
# chanto-sh/chanto's release.yml (npm checks the calling workflow, so this
# file can't be run on its own). No npm token is stored anywhere, so there is
# no long-lived secret that could publish a release. Versions already on npm
# are left alone, so a re-run only publishes what's missing.
name: npm
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # Forks can't publish as chanto-sh.
    if: github.repository == 'chanto-sh/chanto'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # Trusted publishing needs npm 11.5.1+, which Node 24 ships.
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "not a release tag: $TAG"; exit 1; }
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'chanto-*' --dir dist
          python3 packaging/npm/build.py "$TAG" dist npm
          # Pre-releases (v1.2.0-rc.1) go to the `next` dist-tag, never `latest`.
          dist_tag=latest
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || dist_tag=next
          publish() {
            local name version
            name=$(node -p "require('./$1/package.json').name")
            version=$(node -p "require('./$1/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm"
              return
            fi
            # npm may stage a publish for approval on npmjs.com (2FA) rather than
            # release it, and `npm view` doesn't see staged or brand-new
            # versions; a refusal to publish over one also counts as done.
            # A transient failure (the registry or sigstore's transparency log
            # timing out or erroring, or a provenance upload that npm retried
            # into a 409 duplicate) is tried again after a pause; anything else,
            # such as a refused token, fails at once.
            local out attempt
            for attempt in 1 2 3 4; do
              if out=$(cd "$1" && npm publish --access public --provenance --tag "$dist_tag" 2>&1); then
                echo "$out"
                return
              fi
              if grep -qiE 'publish over (the )?previously (published|staged)' <<<"$out"; then
                echo "$name@$version is already published or staged"
                return
              fi
              echo "$out"
              if [ "$attempt" = 4 ] || ! grep -qE 'TLOG_CREATE_ENTRY_ERROR|E50[0-9]|E429|ETIMEDOUT|ECONNRESET|EAI_AGAIN|socket hang up' <<<"$out"; then
                return 1
              fi
              echo "::warning::$name@$version: transient publish failure (attempt $attempt of 4), retrying"
              sleep $((attempt * 30))
              if npm view "$name@$version" version >/dev/null 2>&1; then
                echo "$name@$version reached npm after all"
                return
              fi
            done
          }
          # Platform packages first, so @chanto/cli never points at a missing one.
          for dir in npm/*/; do
            [ "$dir" = npm/chanto/ ] && continue
            publish "${dir%/}"
          done
          publish npm/chanto
