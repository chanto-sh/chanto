name: ci
# Pull requests run here once, again in the merge queue (against the latest
# main), and main runs after each merge. (Running on every branch push as
# well would run each pull request twice.)
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
# A newer push to the same branch cancels the run still going for the last one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
# Checks only read the repository; nothing here needs a writable token.
permissions:
  contents: read
# Debug info for file and line numbers only (backtraces keep them): full debug
# info made every test binary several times larger, which slowed linking
# (most on Windows) and grew the build cache each job restores.
env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
# Only main writes a build cache. GitHub gives the repository one budget shared
# by every ref, and a pull request that stored its own copies (one per job,
# several hundred megabytes each) evicted main's, which every pull request
# restores: runs then started from an empty target directory and recompiled
# every dependency. Pull requests still restore what main wrote.

jobs:
  # GitHub's standard runners are free for public repositories, macOS and
  # Windows included, so the whole suite runs on all three platforms.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      # The extension's server is also exercised by the Rust IDE tests.
      - run: npm ci && npm test
        working-directory: ide/vscode
      # macOS runners are the slowest: use all their cores, and let
      # `cargo test` build the binary rather than a separate `cargo build`.
      - run: cargo check --locked -p chanto-desktop
      - run: cargo test --locked --quiet
        env:
          CHANTO_HOME: ${{ runner.temp }}/chanto-test-home
          CHANTO_COMPAT_HOME: ${{ runner.temp }}/chanto-compat-home
  # rustfmt, on every push: no build, just the format check.
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      - name: Test release metadata checks
        run: python3 -m unittest discover -s packaging -p 'test_*release*.py'
      - name: Check changelog fragments
        run: python3 packaging/changelog.py --check
      - name: Test the test gate
        run: python3 scripts/test_test_gate.py
  # clippy over the whole workspace, on every push. The desktop app needs the
  # same GTK/WebKit packages as `desktop-linux` to build on Linux.
  clippy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libxdo-dev
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
  # chanto-core is what the WebAssembly build shares with the CLI: it must keep
  # building for the browser target, with no OS-only dependency creeping in.
  core-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: cargo check --locked -p chanto-core -p chanto-web --target wasm32-unknown-unknown
      - run: cargo test --locked -p chanto-core
      # The same tests compiled to WebAssembly and run under Node's WASI,
      # the agent loop's scripted turn among them: what the browser build
      # runs has to behave as it does natively.
      - run: cargo test --locked -p chanto-core --target wasm32-wasip1
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: node ${{ github.workspace }}/scripts/wasi-run.mjs
  # The main suite on Linux, on every push (Linux minutes are the cheapest).
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      # bubblewrap for the Linux sandbox; ripgrep for Grep. Ubuntu 24.04
      # restricts the unprivileged user namespaces bubblewrap needs.
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap ripgrep
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      # The extension's server is also exercised by the Rust IDE tests.
      - run: npm ci && npm test
        working-directory: ide/vscode
      # `cargo test` builds the binary the tests run, so no separate build.
      - run: cargo test --locked --quiet
        env:
          CHANTO_HOME: ${{ runner.temp }}/chanto-test-home
          CHANTO_COMPAT_HOME: ${{ runner.temp }}/chanto-compat-home
      - run: cargo test --locked --quiet -p chanto-proto
      # sdk/schema.json has to be what src/wire.rs generates: the SDKs' types
      # come from it.
      - run: cargo test --locked --quiet --features schema --lib 'wire::'
      # The install script: platforms, curl/wget, checksums and signatures.
      - run: sh tests/install.sh
  # Test coverage (cargo-llvm-cov, the compiler's own instrumentation) of the
  # Linux suite, including the chanto binary that tests run as a subprocess.
  # The summary goes on the run page; Codecov comments on pull requests.
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap ripgrep
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov@0.6.21
      # chanto-core's own tests too: code that moved there is tested there.
      - run: cargo llvm-cov --locked --quiet -p chanto -p chanto-core --lcov --output-path lcov.info
        env:
          CHANTO_HOME: ${{ runner.temp }}/chanto-test-home
          CHANTO_COMPAT_HOME: ${{ runner.temp }}/chanto-compat-home
      # Product code only: test files would inflate the figure.
      - name: Summary
        run: |
          cargo llvm-cov report --summary-only -p chanto -p chanto-core \
            --ignore-filename-regex '(^|/)(tests|[a-z_]+_tests)\.rs$' > coverage.txt
          tail -n 1 coverage.txt
          {
            echo '### Test coverage (product code)'
            echo '```'
            tail -n 1 coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          # Only the lcov report; the uploader would also pick up coverage.txt.
          disable_search: true
          use_oidc: true
          fail_ci_if_error: false
      # After the upload, so a drop is still reported. OpenSSF silver asks
      # for 80% line coverage.
      - name: Coverage floor
        run: |
          cargo llvm-cov report --summary-only -p chanto -p chanto-core \
            --ignore-filename-regex '(^|/)(tests|[a-z_]+_tests)\.rs$' \
            --fail-under-lines 80 > /dev/null
  # The lines only Windows compiles count toward Codecov's patch check too;
  # Codecov merges this report with the Linux one (codecov.yml waits for both).
  coverage-windows:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov@0.6.21
      # chanto's tests only: chanto-core's own expect the `/` paths of their
      # in-memory project, and run on Linux and WASI. A failing test still gets
      # its report uploaded (the `windows` job is what judges the tests), so
      # Codecov's status isn't left waiting.
      - run: cargo llvm-cov --locked --quiet --ignore-run-fail -p chanto --lcov --output-path lcov.info
        env:
          CHANTO_HOME: ${{ runner.temp }}/chanto-test-home
          CHANTO_COMPAT_HOME: ${{ runner.temp }}/chanto-compat-home
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: ${{ !cancelled() }}
        with:
          files: lcov.info
          flags: windows
          disable_search: true
          use_oidc: true
          fail_ci_if_error: false
  # Exercise the native sandbox and process-tree tests on Windows.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1
      # The clippy job runs on Linux, which never compiles the Windows-only
      # paths and compiles the Unix-only ones; code left unused here would
      # otherwise only show as warnings in a release build. The desktop app
      # is part of the workspace, so this also checks it.
      # Like macOS: all the runner's cores, and `cargo test` builds the binary
      # rather than a separate `cargo build`.
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --quiet
        env:
          CHANTO_HOME: ${{ runner.temp }}/chanto-test-home
          CHANTO_COMPAT_HOME: ${{ runner.temp }}/chanto-compat-home
  installer-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # install.ps1 under Windows PowerShell 5.1, verified by the OpenSSH
      # client's ssh-keygen and by Git for Windows' OpenSSL, against the
      # fixture tests/install.sh uses (built here with Git Bash).
      - name: Installer fixture
        shell: bash
        run: |
          mkdir -p "$(cygpath -u "$RUNNER_TEMP")/installer"
          PYTHON=python sh tests/install-fixture.sh "$(cygpath -u "$RUNNER_TEMP")/installer"
      - name: install.ps1
        shell: powershell
        run: ./tests/install-windows.ps1 -Fixture "$env:RUNNER_TEMP\installer"
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --locked -j 2 --quiet -p chanto-proto
  # chanto-proto's public API against its last crates.io release: wire
  # types change additively only (see the lint levels in proto/Cargo.toml).
  semver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          package: chanto-proto
  # The desktop app ships in releases, so make sure it builds on every push.
  desktop-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libxdo-dev
      - run: cargo check --locked -p chanto-desktop
  # Computer use on Wayland, in a headless Sway session with grim and ydotool.
  wayland:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: sudo apt-get update && sudo apt-get install -y sway grim ydotool && (ydotool --help 2>&1 | head -5 || true)
      - run: sudo modprobe uinput && sudo chmod 666 /dev/uinput
      - name: Start Sway (headless) and ydotoold
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"
          mkdir -p -m 700 "$XDG_RUNTIME_DIR"
          WLR_BACKENDS=headless WLR_LIBINPUT_NO_DEVICES=1 WLR_RENDERER=pixman sway -c /dev/null > "$RUNNER_TEMP/sway.log" 2>&1 &
          ydotoold > "$RUNNER_TEMP/ydotoold.log" 2>&1 &
          sleep 3
          ls -la "$XDG_RUNTIME_DIR" /tmp | grep -i -e wayland -e ydotool || true
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "WAYLAND_DISPLAY=$(ls "$XDG_RUNTIME_DIR" | grep -m1 -E '^wayland-[0-9]+$')" >> "$GITHUB_ENV"
          echo "SWAYSOCK=$(ls "$XDG_RUNTIME_DIR"/sway-ipc.* 2>/dev/null | head -1)" >> "$GITHUB_ENV"
      - run: cargo test --locked -j 2 wayland_end_to_end -- --ignored --nocapture
      - if: failure()
        run: cat "$RUNNER_TEMP/sway.log" "$RUNNER_TEMP/ydotoold.log" || true
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      # The SDKs' types have to be what sdk/schema.json generates.
      - run: python3 sdk/gen_types.py --check
      - run: python3 -m unittest -v test_chanto_sdk
        working-directory: sdk/python
      - run: npm ci --ignore-scripts && npx tsc --noEmit --target es2022 --module nodenext --moduleResolution nodenext --strict --skipLibCheck --types node index.ts
        working-directory: sdk/typescript
  # The JetBrains plugin. Gradle's wrapper jar isn't committed (it would be an
  # unreviewable binary), so this installs the version gradle-wrapper.properties
  # names and runs it directly.
  jetbrains:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: 9.8.1
      - run: gradle --no-daemon buildPlugin
        working-directory: ide/jetbrains
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s action/tests
  # Dependency policy (deny.toml): licenses, advisories, yanked crates, sources.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
