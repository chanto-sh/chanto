name: rust next
# CI and releases build with the Rust version rust-toolchain.toml pins, so a new
# stable release changes nothing until a pull request bumps the pin. This tries
# the newest stable every week ahead of that bump: if clippy or the tests break
# on it, an issue says so, without failing anyone's pull request.
on:
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # The newest stable, over rust-toolchain.toml's pin.
  RUSTUP_TOOLCHAIN: stable

jobs:
  stable:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - name: Versions
        id: version
        run: |
          rustc --version
          echo "rustc=$(rustc --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --lib --quiet
        env:
          CHANTO_HOME: ${{ runner.temp }}/chanto-test-home
          CHANTO_COMPAT_HOME: ${{ runner.temp }}/chanto-compat-home
    outputs:
      rustc: ${{ steps.version.outputs.rustc }}

  # One open issue at a time: a new failure comments on it.
  report:
    needs: stable
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUSTC: ${{ needs.stable.outputs.rustc }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="The newest stable Rust breaks the build"
          body="clippy or the tests fail on Rust ${RUSTC:-stable}: $RUN. Fix it (and bump rust-toolchain.toml, with every workflow's \`toolchain:\`, in the same pull request) before moving to it."
          n=$(gh issue list --repo "$REPO" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$title" --body "$body"
          fi
