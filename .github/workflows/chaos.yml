name: chaos
# Chaos runs judged by invariants (tests/chaos/invariants.py): no panic, no hang,
# no orphans, sessions parse, nothing written outside the project, no secret
# reaching the model. Uses only the fake model, so it needs no key and runs the
# same for forks. Pull requests get a fixed set; nightly adds more crash points
# and the seeded TUI fuzzer. A nightly failure prints the seed to replay.
on:
  pull_request:
    paths:
      - '**.rs'
      - Cargo.lock
      - tests/chaos/**
      - .github/workflows/chaos.yml
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
concurrency:
  group: chaos-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  chaos:
    name: chaos (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1
      - run: cargo build --locked
      - name: Test the invariants
        run: |
          py=python3; [ "$RUNNER_OS" = Windows ] && py=python
          $py tests/chaos/test_invariants.py
      - name: Chaos
        env:
          TIER: ${{ github.event_name == 'pull_request' && 'pr' || 'nightly' }}
        run: |
          py=python3; [ "$RUNNER_OS" = Windows ] && py=python
          $py tests/chaos/invariants.py --bin target/debug/chanto --tier "$TIER"
