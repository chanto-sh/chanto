name: hosted model
# The real-model smoke test (tests/real-model/smoke.sh) against free hosted
# models, nightly and on demand. It needs API keys, so it never runs for pull
# requests (fork pull requests get no secrets, and pull request code must not
# see them): only code pushed to this repository runs here. A leg whose key secret isn't set
# is skipped; so is an OpenRouter model that has left its free list, which
# changes month to month. Free tiers allow a few dozen requests a day, about
# five per leg.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
permissions:
  contents: read

jobs:
  smoke:
    name: smoke (${{ matrix.model }})
    if: ${{ github.repository == 'chanto-sh/chanto' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Gemma 4 runs on Google AI Studio's own key below, which doesn't
          # share OpenRouter's free pool.
          - service: openrouter
            model: poolside/laguna-xs-2.1:free
          - service: openrouter
            model: nvidia/nemotron-3.5-lightning:free
          - service: groq
            model: qwen/qwen3.8-27b
          # Google AI Studio's free tier (a project with no billing account
          # can't be charged); free-tier prompts may be used for training.
          - service: gemini
            model: gemma-4-26b-a4b-it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check the key and model
        id: ready
        env:
          SERVICE: ${{ matrix.service }}
          MODEL: ${{ matrix.model }}
          HAS_OPENROUTER: ${{ secrets.OPENROUTER_API_KEY != '' }}
          HAS_GROQ: ${{ secrets.GROQ_API_KEY != '' }}
          HAS_GEMINI: ${{ secrets.GEMINI_API_KEY != '' }}
        run: |
          case "$SERVICE" in
            openrouter) has=$HAS_OPENROUTER ;;
            groq) has=$HAS_GROQ ;;
            gemini) has=$HAS_GEMINI ;;
          esac
          if [ "$has" != true ]; then
            echo "::notice::no API key secret for $SERVICE; skipping $MODEL"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$SERVICE" = openrouter ] && ! curl -fsS --retry 3 https://openrouter.ai/api/v1/models \
              | jq -e --arg m "$MODEL" 'any(.data[]; .id == $m and ((.supported_parameters // []) | index("tools")))' > /dev/null; then
            echo "::warning::$MODEL is no longer a free tool-calling model on OpenRouter; skipping (update the matrix)"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: ${{ steps.ready.outputs.run == 'true' }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: ${{ steps.ready.outputs.run == 'true' }}
        with:
          save-if: false
      - run: cargo build --locked
        if: ${{ steps.ready.outputs.run == 'true' }}
      - name: Smoke test
        if: ${{ steps.ready.outputs.run == 'true' }}
        env:
          SERVICE: ${{ matrix.service }}
          MODEL: ${{ matrix.model }}
          OPENROUTER_API_KEY: ${{ matrix.service == 'openrouter' && secrets.OPENROUTER_API_KEY || '' }}
          GROQ_API_KEY: ${{ matrix.service == 'groq' && secrets.GROQ_API_KEY || '' }}
          GEMINI_API_KEY: ${{ matrix.service == 'gemini' && secrets.GEMINI_API_KEY || '' }}
        # Through Chanto's built-in provider for each service, which reads the
        # service's own key variable. A free model's shared pool can be busy
        # (429): wait and retry, but fail on anything else.
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if tests/real-model/smoke.sh target/debug/chanto - "$SERVICE/$MODEL" 2>&1 | tee smoke.log; then
              exit 0
            fi
            grep -q "API error 429" smoke.log || exit 1
            echo "::warning::$SERVICE/$MODEL is rate-limited (attempt $attempt); retrying in a minute"
            sleep 60
          done
          exit 1
