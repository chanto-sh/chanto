name: mutants
# Breaks the lines a pull request changes, one at a time, and checks that a test
# fails each time: coverage says a line ran, this says a test would notice. A
# run takes one build per mutant, so it stays out of ci.yml, and it's advisory:
# some mutants can't change behaviour a test could see. Missed mutants don't
# fail the check; they're in the run's summary.
on:
  pull_request:
    paths:
      - '**.rs'
      - .github/workflows/mutants.yml
concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: false
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap ripgrep
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-mutants@27.1.0
      - name: Mutate the changed lines
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          CHANTO_HOME: ${{ runner.temp }}/chanto-test-home
          CHANTO_COMPAT_HOME: ${{ runner.temp }}/chanto-compat-home
        run: |
          git diff "$BASE...$HEAD" -- '*.rs' ':!*tests.rs' ':!tests/' ':!fuzz/' > "$RUNNER_TEMP/changes.diff"
          # In the diff's order and the baseline left to ci.yml: the same mutants
          # for the same change. Exits 2 and 3 are missed and timed-out mutants, reported below.
          status=0
          cargo mutants --in-diff "$RUNNER_TEMP/changes.diff" --no-shuffle --baseline=skip \
            --timeout 300 --cargo-test-arg=--lib -o "$RUNNER_TEMP" || status=$?
          case "$status" in 0 | 2 | 3) ;; *) exit "$status" ;; esac
      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          out="$RUNNER_TEMP/mutants.out"
          [ -d "$out" ] || exit 0
          {
            echo '### Mutants on the changed lines'
            echo "caught $(wc -l < "$out/caught.txt"), missed $(wc -l < "$out/missed.txt"), timed out $(wc -l < "$out/timeout.txt")"
            if [ -s "$out/missed.txt" ]; then
              echo 'No test noticed these changes:'
              echo '```'
              cat "$out/missed.txt"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
