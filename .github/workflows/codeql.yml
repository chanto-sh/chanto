# CodeQL code scanning: the same languages and `security-extended` queries as
# GitHub's default setup had, as a workflow in the repository. Default setup
# never started for Dependabot's pull requests here, so their required
# `Analyze (...)` checks never reported and they couldn't merge until someone
# pushed to them by hand. A workflow runs for every pull request, Dependabot's
# included. Default setup must stay off (Settings → Code security): GitHub
# rejects uploads from a workflow while it's on.
name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    # The required status checks match these names.
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python, ruby, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"

  # A pull request's scan is compared against main and cannot introduce an
  # alert (the "Require code scanning results" rule in "protect main"). A scan
  # of main itself can still find something new after merge, so check the
  # backlog as soon as the analysis finishes instead of waiting for the
  # six-hourly code-scanning-watch. That job keeps the tracking issue current.
  watch:
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: read
      issues: write
    concurrency:
      group: codeql-watch
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Let the new analysis land
        run: sleep 30
      - name: Check the post-merge backlog
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/codeql-watch.sh
