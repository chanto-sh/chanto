# Keep Chanto's own startup and per-turn cost from regressing.
#
# The base commit is built from its own source and measured on this same
# runner, interleaved with the pull request's build, so the comparison is not
# between two machines. A metric fails when it is over the fixed ceiling in
# tests/perf/budgets.json, when it is significantly slower than the base
# (one-sided Mann-Whitney U at alpha), or when it is slower by more than
# large_change. See tests/perf/gate.py.
#
# Every platform is measured: a regression that only shows up where the code
# takes a different path (libc, the allocator, process startup) would otherwise
# land unnoticed. GitHub's standard runners are free for a public repository,
# macOS and Windows included; the cost is build time, so the three run in
# parallel.
#
# The Linux job also re-runs the workload pinned to a single core with a
# small-device ceiling, for the machines with no spare cores and little memory
# that the rest of the gate cannot speak for.
#
# The job is expected to be a required check; it needs no secrets and runs
# read-only, so pull requests from forks are measured the same way.
#
# A push to main warms the build cache and measures nothing: those runners
# build the release profile once, so the pull requests that follow restore
# every dependency instead of compiling them again. Only main writes a cache.
# GitHub gives the repository one budget shared by every ref, so a pull
# request that stored its own copy evicted the one it and the other pull
# requests restored, and each run started from an empty target directory.
#
# That push also keeps its release binary, keyed by commit and compiler, so a
# pull request based on it restores its base instead of building it again.
# A miss (a merge that changed no Rust, an evicted entry) builds it as before.
name: perf
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  # These measurements only say something about Rust, so a change that touches
  # no Rust (docs, workflows, the site, the IDE plugins) skips them. A skipped
  # job counts as passing; a path filter on the workflow instead would leave
  # the check waiting forever. A push to main asks the same question about its
  # own commits, so a documentation merge does not pay for three release
  # builds.
  changes:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          # A pull request diffs against its base; a push to main against the
          # commit it replaced.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.after }}
        run: |
          # A rewritten branch leaves no `before` to diff against; warming the
          # cache is never wrong, so that counts as Rust.
          if [ -z "$BASE" ] || [ -z "$HEAD" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo rust=true >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE...$HEAD" | grep -qE '(^|/)(src|proto|tests/(perf|chaos))/|\.rs$|(^|/)Cargo\.(toml|lock)$|^\.github/workflows/perf\.yml$'; then
            echo rust=true >> "$GITHUB_OUTPUT"
          else
            echo rust=false >> "$GITHUB_OUTPUT"
          fi

  bench:
    needs: changes
    # The job always runs, so each platform reports its own check (they are
    # required): a skipped matrix job reports one check named after the
    # unexpanded matrix instead, and a required check would wait forever.
    # The merge queue and manual runs always measure; anything else only when it
    # changes Rust. Otherwise every step is skipped and the check passes.
    if: ${{ !cancelled() }}
    # Spelled out rather than left to the default, which also lists the extra
    # matrix values and would change the check's name.
    name: bench (${{ matrix.os }})
    strategy:
      # One platform failing says nothing about the other two.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            # A small machine has one core and little memory; the Linux
            # runner is the one that can pretend to be it with `taskset`.
            extra_args: --device
          - os: macos-latest
          # Two jobs, like the rest of CI: a release build uses every core the
          # runner has and this one is close to its memory limit.
          - os: windows-2022
            cargo_flags: -j 2
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # Measures too when the change detection didn't succeed, rather than pass blindly.
      MEASURE: ${{ github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || needs.changes.result != 'success' || needs.changes.outputs.rust == 'true' }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      # The commit the pull request is based on, or the merge queue's target.
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
      # setup-python is not used, and the Windows image calls it `python`.
      PYTHON: ${{ startsWith(matrix.os, 'windows') && 'python' || 'python3' }}
    defaults:
      # Git Bash on Windows as well, so one script serves all three.
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: env.MEASURE == 'true'
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: env.MEASURE == 'true'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: env.MEASURE == 'true'
        with:
          key: perf
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Git Bash is handed Windows paths in $RUNNER_TEMP and
      # $CARGO_TARGET_DIR but its own commands need POSIX ones, and the built
      # binary carries an extension here.
      - name: Paths
        if: env.MEASURE == 'true'
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            temp="$(cygpath -u "$RUNNER_TEMP")"
            target="$(cygpath -u "$CARGO_TARGET_DIR")"
            bin=chanto.exe
          else
            temp="$RUNNER_TEMP"
            target="$CARGO_TARGET_DIR"
            bin=chanto
          fi
          {
            echo "BENCH_TEMP=$temp"
            echo "BENCH_TARGET=$target"
            echo "BENCH_BIN=$bin"
            # Part of the saved binary's key: a new stable Rust between main's
            # build and the pull request's would otherwise be measured as a
            # change in the pull request.
            echo "RUSTC_VERSION=$(rustc --version | cut -d' ' -f2)"
          } >> "$GITHUB_ENV"
      # The base is usually a commit main's own run already built: reuse that
      # binary rather than spend the job's other half building it again.
      # Measuring still happens here, on this runner, next to the head.
      - name: Restore the base build
        id: base-bin
        if: ${{ env.MEASURE == 'true' && (env.BASE_SHA != '') }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/perf-bin
          key: perf-bin-${{ matrix.os }}-${{ env.RUSTC_VERSION }}-${{ env.BASE_SHA }}
      # The gate's own tests are pure Python: run them before the builds.
      - name: Test the gate
        if: env.MEASURE == 'true'
        run: $PYTHON -m unittest discover -s tests/perf -p 'test_*.py'
      - name: Build the head commit
        if: env.MEASURE == 'true'
        run: |
          cargo build --release --locked ${{ matrix.cargo_flags }}
          cp "$BENCH_TARGET/release/$BENCH_BIN" "$BENCH_TEMP/chanto-head"
      # A push to main keeps its build for the pull requests based on it.
      - name: Keep the build for pull requests
        if: ${{ env.MEASURE == 'true' && github.event_name == 'push' }}
        run: |
          mkdir -p "$BENCH_TEMP/perf-bin"
          cp "$BENCH_TEMP/chanto-head" "$BENCH_TEMP/perf-bin/chanto"
      - if: ${{ env.MEASURE == 'true' && github.event_name == 'push' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/perf-bin
          key: perf-bin-${{ matrix.os }}-${{ env.RUSTC_VERSION }}-${{ github.sha }}
      - name: Use the saved base build
        if: steps.base-bin.outputs.cache-hit == 'true'
        run: cp "$BENCH_TEMP/perf-bin/chanto" "$BENCH_TEMP/chanto-base"
      # Built second, in the same target directory: the dependencies are
      # already compiled, so this is mostly the crate itself.
      - name: Build the base commit
        if: ${{ env.MEASURE == 'true' && (env.BASE_SHA != '') && steps.base-bin.outputs.cache-hit != 'true' }}
        run: |
          git worktree add --detach "$BENCH_TEMP/base" "$BASE_SHA"
          cargo build --release --locked ${{ matrix.cargo_flags }} \
            --manifest-path "$BENCH_TEMP/base/Cargo.toml"
          cp "$BENCH_TARGET/release/$BENCH_BIN" "$BENCH_TEMP/chanto-base"
      # A warm run has nothing to compare: the head measures only against the
      # fixed ceilings, and that is what the pull request's own run does.
      - name: Measure
        if: ${{ env.MEASURE == 'true' && (github.event_name != 'push') }}
        run: |
          base=()
          if [ -f "$BENCH_TEMP/chanto-base" ]; then
            base=(--base "$BENCH_TEMP/chanto-base")
          fi
          $PYTHON tests/perf/gate.py \
            --head "$BENCH_TEMP/chanto-head" "${base[@]}" \
            ${{ matrix.extra_args }} \
            --json "$BENCH_TEMP/perf.json" \
            --summary-md "$BENCH_TEMP/perf.md"
      # A very long session and a very large tree (tests/perf/stress.py),
      # against the fake model. ripgrep and clangd make its Grep and
      # language-server checks real; it needs POSIX tools, so not Windows.
      - name: Stress
        if: ${{ env.MEASURE == 'true' && github.event_name != 'push' && runner.os != 'Windows' }}
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep clangd >/dev/null
          else
            brew install ripgrep >/dev/null
          fi
          $PYTHON tests/perf/stress.py --bin "$BENCH_TEMP/chanto-head" \
            --json "$BENCH_TEMP/stress.json" --summary-md "$BENCH_TEMP/stress.md"
      - if: ${{ env.MEASURE == 'true' && !cancelled() && github.event_name != 'push' && runner.os != 'Windows' }}
        run: |
          if [ -f "$BENCH_TEMP/stress.md" ]; then cat "$BENCH_TEMP/stress.md" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload the report
        if: ${{ env.MEASURE == 'true' && (!cancelled() && github.event_name != 'push') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: chanto-perf-${{ matrix.os }}
          path: ${{ runner.temp }}/perf.json
          retention-days: 14
          if-no-files-found: warn
