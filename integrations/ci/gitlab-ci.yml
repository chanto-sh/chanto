# .gitlab-ci.yml (or include it from there)
chanto-review:
  image: alpine:3.22
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  timeout: 1h
  script:
    - apk add --no-cache curl
    - curl -fsSL https://chanto.sh/install.sh | sh
    - ~/.local/bin/chanto cloud run --agent reviewer --input "Merge request !$CI_MERGE_REQUEST_IID: $CI_MERGE_REQUEST_TITLE" --ref "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" --wait
  # CHANTO_CLOUD_TOKEN (masked) and CHANTO_CLOUD_ORG: Settings > CI/CD > Variables
