# .github/workflows/chanto-review.yml
name: Chanto review
on:
  pull_request:
    types: [opened, ready_for_review]

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: chanto-sh/chanto/action@eda3f9288afccb98be7b889a0fc50deac5402f1b # v0.1.13
        with:
          cloud_agent: reviewer
          cloud_input: "Pull request #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"
          cloud_token: ${{ secrets.CHANTO_CLOUD_TOKEN }}
          cloud_org: ${{ vars.CHANTO_CLOUD_ORG }}

