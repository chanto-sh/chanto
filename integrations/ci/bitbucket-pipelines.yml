# bitbucket-pipelines.yml
pipelines:
  pull-requests:
    '**':
      - step:
          name: Chanto review
          image: alpine:3.22
          max-time: 60
          script:
            - apk add --no-cache curl
            - curl -fsSL https://chanto.sh/install.sh | sh
            - ~/.local/bin/chanto cloud run --agent reviewer --input "Pull request #$BITBUCKET_PR_ID" --ref "$BITBUCKET_BRANCH" --wait
# CHANTO_CLOUD_TOKEN (secured) and CHANTO_CLOUD_ORG: Repository settings > Repository variables
