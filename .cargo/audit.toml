# Advisories the daily Audit workflow (cargo-audit) skips. Each also appears
# in osv-scanner.toml, which says why it doesn't affect Chanto; cargo-deny
# keeps its own list in deny.toml. Drop an entry once the dependency is gone.
[advisories]
ignore = [
    # glib 0.18, only in the Linux desktop app's GTK stack (tao, wry, muda);
    # Chanto never uses VariantStrIter. Fixed upstream in the gtk 0.20+ stack.
    "RUSTSEC-2024-0429",
    # proc-macro-error: unmaintained, not vulnerable; a build-time macro of
    # glib-macros in the same desktop GTK stack.
    "RUSTSEC-2024-0370",
    # bincode 1.3.3, via syntect's built-in syntaxes and themes: unmaintained
    # but complete, not vulnerable. syntect 5.3.0, the latest, still needs it.
    "RUSTSEC-2025-0141",
]
