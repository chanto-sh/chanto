[package]
name = "chanto-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

# Not a member of the root workspace: it builds on nightly with cargo-fuzz,
# and root `cargo build`/`cargo test` never touch it.
[workspace]

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
chanto = { path = "..", features = ["fuzzing"] }
libfuzzer-sys = "0.4"
serde_json = "1"
url = "2.5.8"

[[bin]]
name = "shell_permission"
path = "fuzz_targets/shell_permission.rs"
test = false
doc = false
bench = false

[[bin]]
name = "redact"
path = "fuzz_targets/redact.rs"
test = false
doc = false
bench = false

[[bin]]
name = "url_checks"
path = "fuzz_targets/url_checks.rs"
test = false
doc = false
bench = false
