# Advisories that don't affect the fuzz workspace, read by OSV-Scanner and
# OpenSSF Scorecard. osv-scanner only reads the file next to each lockfile, so
# this repeats the root one. Each says why; cargo-deny keeps its own list in
# deny.toml.

[[IgnoredVulns]]
id = "RUSTSEC-2025-0141"
reason = "bincode 1.3.3 (via syntect, for syntax highlighting) is unmaintained but complete, not vulnerable; also ignored in deny.toml and the root osv-scanner.toml."

[[IgnoredVulns]]
id = "GHSA-qwgh-2vcv-g2f7"
reason = "block-buffer 0.10.4 is in the lockfile but on no path the fuzz targets compile: it comes only from ratatui's optional termwiz backend, which nothing enables. No 0.10.x release fixes it, and digest 0.10 needs block-buffer 0.10, so it stays until termwiz moves to sha2 0.11. Also ignored in the root osv-scanner.toml."
